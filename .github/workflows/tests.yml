name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  maven-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Runs Surefire (unit tests + ArchUnit) and Failsafe (Testcontainers integration tests) for
      # both modules in one command. No `services:` block needed — Testcontainers talks to the
      # Docker daemon already present on ubuntu-latest runners.
      - name: mvn verify (unit + ArchUnit + Testcontainers integration)
        run: mvn -B verify
