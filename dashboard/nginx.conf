# nginx escucha en 8008 (no en 80) para que el puerto sea el mismo adentro y afuera del
# contenedor, igual que hacen order-service (8006) y notification-service (8007).
server {
    listen 8008;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA de una sola ruta: cualquier path desconocido devuelve index.html en vez de un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre, asi que se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html NO se cachea: es lo que apunta al bundle nuevo despues de cada rebuild.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
