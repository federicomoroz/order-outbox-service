server:
  port: 8007

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5433/notifications
    username: notifications
    password: notifications
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Origenes del navegador autorizados a llamar /api/** (el dashboard React).
# Override en despliegue: WEB_CORS_ALLOWED_ORIGINS
web:
  cors:
    allowed-origins: http://localhost:8008,http://localhost:5173

logging:
  level:
    com.federicomoroz.orderoutbox: INFO
